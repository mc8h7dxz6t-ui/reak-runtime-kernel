[workspace]
resolver = "2"
members = [
    "crates/reak-types",
    "crates/reak-durable-record",
    "crates/reak-policy-context",
    "crates/reak-ues",
    "crates/reak-registry",
    "crates/reak-replay",
    "crates/reak-authority",
    "crates/reak-exposure",
    "crates/reak-commitment",
    "crates/reak-dispatch",
    "crates/reak-observation",
    "crates/reak-reconciliation",
    "crates/reak-truth",
    "crates/reak-recovery",
]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
[workspace.dependencies]
reak-types = { path = "crates/reak-types" }
reak-durable-record = { path = "crates/reak-durable-record" }
reak-policy-context = { path = "crates/reak-policy-context" }
reak-ues = { path = "crates/reak-ues" }
reak-registry = { path = "crates/reak-registry" }
reak-replay = { path = "crates/reak-replay" }
reak-authority = { path = "crates/reak-authority" }
reak-exposure = { path = "crates/reak-exposure" }
reak-commitment = { path = "crates/reak-commitment" }
reak-dispatch = { path = "crates/reak-dispatch" }
reak-observation = { path = "crates/reak-observation" }
reak-reconciliation = { path = "crates/reak-reconciliation" }
reak-truth = { path = "crates/reak-truth" }
reak-recovery = { path = "crates/reak-recovery" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
parking_lot = "0.12"
proptest = "1"
